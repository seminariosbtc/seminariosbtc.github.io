title: "Seminários Brasileiros de Teoria de Computação"
title_separator: "·"
subtitle: "Algoritmos, Combinatória e Otimização"
url: "https://seminariosbtc.github.io"
baseurl: ""
repository: "seminariosbtc/seminariosbtc.github.io"
locale: "pt-BR"
timezone: "America/Sao_Paulo"

# Cole aqui as URLs fornecidas em Google Calendar → Integrar agenda.
google_calendar_embed_url: "https://calendar.google.com/calendar/embed?src=seminariosbtc%40gmail.com&ctz=America%2FSao_Paulo"
google_calendar_subscribe_url: "https://calendar.google.com/calendar/u/0?cid=c2VtaW5hcmlvc2J0Y0BnbWFpbC5jb20"

remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "air"
search: true
search_full_content: true
breadcrumbs: true
words_per_minute: 180
future: true

# markdown: kramdown
# permalink: /caderno/:title/
# paginate: 6
# paginate_path: /pagina:num/

include:
  - _pages

collections:
  seminars:
    output: true
    permalink: /agenda/:path/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/seminariosbtc/seminariosbtc.github.io"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      show_date: true
      share: false
      related: true
      classes: wide
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
      classes: wide
  - scope:
      path: ""
      type: seminars
    values:
      layout: seminar
      author_profile: false
      show_date: false
      read_time: false
      share: false
      related: false
      classes: "wide sb-seminar"

category_archive:
  type: liquid
  path: /categorias/

tag_archive:
  type: liquid
  path: /temas/

exclude:
  - GUIA-UPLOAD-GITHUB.md
  - CV-INSTRUCOES.txt
  - cv.pdf
  - style.css
  - script.js
  - publications.html
  - activities.html
  - contact.html
  - vendor
  - README.md
