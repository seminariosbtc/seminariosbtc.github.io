name: "Enviar um seminário"
description: "Sugira um encontro para inclusão na agenda."
title: "[Seminário] "
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por colaborar. Antes de enviar, confira se há um link público
        da instituição ou série responsável pelo encontro.
  - type: input
    id: title
    attributes:
      label: "Título da palestra"
      placeholder: "Título completo"
    validations:
      required: true
  - type: input
    id: speaker
    attributes:
      label: "Pessoa convidada e instituição"
      placeholder: "Nome — Universidade ou instituto"
    validations:
      required: true
  - type: input
    id: series
    attributes:
      label: "Série ou grupo responsável"
      placeholder: "Nome do seminário, laboratório ou departamento"
    validations:
      required: true
  - type: input
    id: datetime
    attributes:
      label: "Data, horário e fuso"
      placeholder: "21/08/2026, 14h, horário de Brasília"
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: "Modalidade"
      options:
        - Presencial
        - Híbrido
        - Online
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: "Cidade e local, quando aplicável"
      placeholder: "Fortaleza, CE — Departamento Exemplo"
  - type: input
    id: link
    attributes:
      label: "Link oficial"
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: abstract
    attributes:
      label: "Resumo"
      description: "Cole o resumo oficial ou indique onde ele pode ser consultado."
  - type: input
    id: topic
    attributes:
      label: "Área ou palavras-chave"
      placeholder: "Algoritmos, grafos temporais"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: "Confirmação"
      options:
        - label: "Verifiquei os dados no link oficial."
          required: true
